<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canary</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <!-- Logo doubles as the link to the website -->
      <a class="brand" href="https://canary.fishing" target="_blank" rel="noopener" aria-label="Open canary.fishing" title="canary.fishing">
        <span class="brand-mark" aria-hidden="true">
          <svg class="brand-rod" viewBox="0 0 36 36">
            <line x1="5" y1="31" x2="26" y2="9" stroke="#fff" stroke-width="2.25" stroke-linecap="round" />
            <path d="M24 11 Q27 16 24 21" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" />
            <circle cx="24" cy="21" r="1.3" fill="#fff" />
          </svg>
          <svg class="bird brand-bird" viewBox="0 0 24 24">
            <path d="M16 7h.01" /><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20" /><path d="m20 7 2 .5-2 .5" /><path d="M10 18v3" /><path d="M14 17.75V21" /><path d="M7 18a6 6 0 0 0 3.84-10.61" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Canary</span>
          <span class="brand-sub">Your email safety helper</span>
        </span>
      </a>
    </header>

    <main>
      <section id="status" class="status status-idle" aria-live="polite">
        <div class="light" aria-hidden="true">
          <svg class="bird" viewBox="0 0 24 24">
            <path d="M16 7h.01" /><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20" /><path d="m20 7 2 .5-2 .5" /><path d="M10 18v3" /><path d="M14 17.75V21" /><path d="M7 18a6 6 0 0 0 3.84-10.61" />
          </svg>
        </div>
        <div class="status-body">
          <h2 id="status-title">Open an email in Gmail</h2>
          <p id="status-text">Canary checks each email you open and tells you if it's safe.</p>
        </div>
      </section>

      <section id="action-box" class="action" hidden>
        <strong>What to do:</strong>
        <span id="action-text"></span>
      </section>

      <section class="settings">
        <label class="toggle">
          <input type="checkbox" id="enabled" checked />
          <span>Check my emails</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="bigtext" />
          <span>Extra-large text</span>
        </label>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>

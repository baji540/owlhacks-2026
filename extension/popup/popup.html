<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canary</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <!-- Logo doubles as the link to the website -->
      <a class="brand" href="https://canary.fishing" target="_blank" rel="noopener" aria-label="Open canary.fishing" title="Visit canary.fishing">
        <span class="brand-mark" aria-hidden="true">
          <!-- Canary logo (same artwork as extension/icons and canary-logo.svg) -->
          <svg class="brand-logo" viewBox="0 0 32 32">
            <!-- rod (thin, shallow, tip visible) -->
              <line x1="-2" y1="27.47" x2="28.6" y2="18.29" stroke="#fff" stroke-width="1.25" stroke-linecap="round"/>
              <!-- line + hook hanging from the tip -->
              <path d="M28.6 18.29 Q30.20 21.49 28.80 24.69" fill="none" stroke="#fff" stroke-width="0.85" stroke-linecap="round"/>
              <circle cx="28.80" cy="24.99" r="0.95" fill="#fff"/>
              <!-- Lucide bird (same icon as the Gmail badges and the site) -->
              <svg x="4.2" y="2.2" width="22.5" height="22.5" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M10 18V20.61"/><path d="M14 17.75V19.41"/><path d="M7 18a6 6 0 0 0 3.84-10.61"/>
              </svg>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Canary</span>
          <span class="brand-sub">Your email safety helper</span>
        </span>
      </a>
    </header>

    <main>
      <section id="status" class="status status-idle" aria-live="polite">
        <div class="light" aria-hidden="true">
          <svg class="bird" viewBox="0 0 24 24">
            <path d="M16 7h.01" /><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20" /><path d="m20 7 2 .5-2 .5" /><path d="M10 18v3" /><path d="M14 17.75V21" /><path d="M7 18a6 6 0 0 0 3.84-10.61" />
          </svg>
        </div>
        <div class="status-body">
          <h2 id="status-title">Open an email in Gmail</h2>
          <p id="status-text">Canary checks each email you open and tells you if it's safe.</p>
        </div>
      </section>

      <section id="action-box" class="action" hidden>
        <strong>What to do:</strong>
        <span id="action-text"></span>
      </section>

      <section class="settings">
        <label class="toggle">
          <input type="checkbox" id="enabled" checked />
          <span>Check my emails</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="bigtext" />
          <span>Extra-large text</span>
        </label>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
